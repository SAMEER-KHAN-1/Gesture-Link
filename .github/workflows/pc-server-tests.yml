name: PC server tests

on:
  push:
    branches: [main]
    paths:
      - "pc-server/**"
      - ".github/workflows/pc-server-tests.yml"
  pull_request:
    paths:
      - "pc-server/**"
      - ".github/workflows/pc-server-tests.yml"

jobs:
  pytest:
    # The server drives Windows APIs through ctypes, so it can only be tested on Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pc-server/requirements.txt
            pc-server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
